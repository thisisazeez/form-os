<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Survey Closed</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: '#0d9488',
                hover: '#0f766e'
              },
              secondary: '#3d63dc',
              success: '#8ac449',
              surface: {
                page: '#faf8f7',
                card: '#ffffff',
                panel: '#f2f4ef'
              },
              ink: {
                heading: '#222b27',
                body: '#444444',
                muted: '#666666'
              },
              border: 'rgba(34, 43, 39, 0.10)'
            },
            borderRadius: {
                    "DEFAULT": "0.5rem", // 8px default
                    "lg": "0.75rem", // 12px
                    "xl": "1rem", // 16px
                    "full": "9999px"
            },
            boxShadow: {
                'card': '0 4px 24px -6px rgba(34, 43, 39, 0.08)',
            },
            fontFamily: {
                    "headline": ["Outfit", "sans-serif"],
                    "display": ["Outfit", "sans-serif"],
                    "body": ["Inter", "sans-serif"],
                    "label": ["Inter", "sans-serif"]
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-page font-body text-ink-body antialiased min-h-screen flex flex-col items-center justify-center p-4">
<!-- Main Card Container -->
<main class="w-full max-w-md mx-auto flex-1 flex flex-col justify-center items-center gap-8 relative z-10">
<div class="bg-surface-card rounded shadow-card p-8 md:p-10 w-full text-center flex flex-col items-center border border-border">
<!-- Status Icon/Illustration -->
<div class="w-20 h-20 bg-surface-panel rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-[40px] text-ink-muted" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
</div>
<!-- Content -->
<h1 class="font-headline text-2xl md:text-3xl font-bold text-ink-heading mb-3 tracking-tight">
                This survey is closed
            </h1>
<p class="text-base text-ink-body leading-relaxed max-w-[280px] mx-auto">
                Thanks for your interest — responses are no longer being collected.
            </p>
<!-- Optional: Return action (hidden by default based on spec, but structurally useful for typical flows) -->
<!--
            <div class="mt-8">
                 <button class="bg-surface-panel text-ink-heading px-6 py-2.5 rounded font-medium text-sm hover:bg-border transition-colors duration-150 flex items-center gap-2">
                     <span class="material-symbols-outlined text-sm">arrow_back</span>
                     Return Home
                 </button>
            </div>
            -->
</div>
</main>
<!-- Footer Component Generated from JSON -->
<footer class="w-full flex flex-col items-center gap-2 pb-8 px-4 bg-transparent mt-auto relative z-10">
<div class="flex items-center gap-1 font-headline font-semibold text-[#666] text-sm">
<span>Powered by</span>
<a class="text-[#0d9488] hover:text-[#222b27] transition-colors duration-150" href="#">onForm</a>
</div>
<div class="flex items-center gap-4 mt-2">
<a class="font-body text-sm font-medium text-[#666] hover:text-[#222b27] transition-colors" href="#">Privacy Policy</a>
<span class="text-border text-xs">|</span>
<a class="font-body text-sm font-medium text-[#666] hover:text-[#222b27] transition-colors" href="#">Report Abuse</a>
</div>
</footer>
<!-- Decorative background elements (optional, subtle) -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0 flex items-center justify-center">
<div class="w-[800px] h-[800px] rounded-full bg-gradient-to-tr from-surface-panel/30 to-transparent blur-3xl absolute opacity-50 translate-y-1/4"></div>
</div>
</body></html>
