<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>onForm - Single Select Radio</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Public+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: '#0d9488',
                        'primary-hover': '#0f766e',
                        secondary: '#3d63dc',
                        tertiary: '#8ac449',
                        ink: {
                            DEFAULT: '#222b27',
                            muted: '#666666',
                            secondary: '#444444'
                        },
                        surface: {
                            DEFAULT: '#faf8f7',
                            card: '#ffffff',
                            panel: '#f2f4ef'
                        },
                        border: 'rgba(34,43,39,0.10)'
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        "2xl": "1rem",
                        full: "9999px"
                    },
                    fontFamily: {
                        headline: ["Public Sans", "sans-serif"],
                        display: ["Public Sans", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                        label: ["Inter", "sans-serif"]
                    },
                    boxShadow: {
                        soft: '0 4px 20px 0 rgba(34,43,39,0.05)',
                        'soft-lg': '0 8px 30px 0 rgba(34,43,39,0.08)'
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #faf8f7; }
        .radio-card-input:checked + .radio-card-content {
            border-color: #0d9488;
            background-color: rgba(230, 73, 24, 0.05);
        }
        .radio-card-input:checked + .radio-card-content .radio-circle {
            border-color: #0d9488;
        }
        .radio-card-input:checked + .radio-card-content .radio-circle::after {
            transform: scale(1);
        }
        .radio-circle::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #0d9488;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.2s ease-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body text-ink antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-[#faf8f7] border-b border-[rgba(34,43,39,0.10)] sticky top-0 z-40">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-4xl mx-auto">
<button aria-label="Close" class="text-[#666] font-medium hover:opacity-80 transition-opacity flex items-center justify-center p-2 rounded-full hover:bg-surface-panel transition-colors">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
<h1 class="font-headline font-bold text-lg text-ink">Question 1 of 10</h1>
<div class="font-headline font-bold text-sm text-[#444]">
                onForm
            </div>
</div>
<!-- Progress Bar (Contextual Addition) -->
<div class="w-full h-1 bg-surface-panel absolute bottom-0 left-0">
<div class="h-full bg-primary" style="width: 10%;"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-3xl mx-auto px-6 py-12 pb-32">
<div class="space-y-8 animate-[fadeIn_0.5s_ease-out]">
<!-- Question Header -->
<div class="text-center space-y-3">
<h2 class="font-headline font-bold text-3xl md:text-4xl text-ink tracking-tight">Which feature do you use most often?</h2>
<p class="font-body text-ink-muted text-lg">Select the primary tool that drives your workflow.</p>
</div>
<!-- Single Select Radio Cards -->
<fieldset class="space-y-4 mt-8">
<legend class="sr-only">Feature selection</legend>
<!-- Option 1: Selected State Example -->
<label class="block relative cursor-pointer group">
<input checked="" class="radio-card-input sr-only" name="feature_usage" type="radio" value="dashboard"/>
<div class="radio-card-content border-2 border-border bg-white rounded-2xl p-6 flex items-center transition-all duration-200 shadow-soft hover:shadow-soft-lg group-hover:-translate-y-0.5">
<div class="mr-4 w-12 h-12 rounded-full bg-surface-panel flex items-center justify-center text-ink-secondary group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">bar_chart</span>
</div>
<div class="flex-grow">
<h3 class="font-headline font-bold text-xl text-ink mb-1">Dashboard Analytics</h3>
<p class="font-body text-ink-muted text-sm leading-relaxed">Visualizing survey data, tracking trends, and generating executive reports.</p>
</div>
<div class="ml-4 relative w-6 h-6 rounded-full border-2 border-border radio-circle transition-colors duration-200"></div>
</div>
</label>
<!-- Option 2 -->
<label class="block relative cursor-pointer group">
<input class="radio-card-input sr-only" name="feature_usage" type="radio" value="builder"/>
<div class="radio-card-content border-2 border-border bg-white rounded-2xl p-6 flex items-center transition-all duration-200 shadow-soft hover:shadow-soft-lg group-hover:-translate-y-0.5">
<div class="mr-4 w-12 h-12 rounded-full bg-surface-panel flex items-center justify-center text-ink-secondary group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">build</span>
</div>
<div class="flex-grow">
<h3 class="font-headline font-bold text-xl text-ink mb-1">Survey Builder</h3>
<p class="font-body text-ink-muted text-sm leading-relaxed">Creating new questionnaires, managing logic branching, and publishing.</p>
</div>
<div class="ml-4 relative w-6 h-6 rounded-full border-2 border-border radio-circle transition-colors duration-200"></div>
</div>
</label>
<!-- Option 3 -->
<label class="block relative cursor-pointer group">
<input class="radio-card-input sr-only" name="feature_usage" type="radio" value="contacts"/>
<div class="radio-card-content border-2 border-border bg-white rounded-2xl p-6 flex items-center transition-all duration-200 shadow-soft hover:shadow-soft-lg group-hover:-translate-y-0.5">
<div class="mr-4 w-12 h-12 rounded-full bg-surface-panel flex items-center justify-center text-ink-secondary group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">groups</span>
</div>
<div class="flex-grow">
<h3 class="font-headline font-bold text-xl text-ink mb-1">Contact Management</h3>
<p class="font-body text-ink-muted text-sm leading-relaxed">Organizing respondent lists, handling opt-outs, and targeting demographics.</p>
</div>
<div class="ml-4 relative w-6 h-6 rounded-full border-2 border-border radio-circle transition-colors duration-200"></div>
</div>
</label>
</fieldset>
</div>
</main>
<!-- BottomNavBar -->
<footer class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-6 py-4 bg-white shadow-[0_-4px_20px_0_rgba(34,43,39,0.05)] rounded-t-xl">
<div class="w-full max-w-4xl mx-auto flex justify-between items-center">
<button class="flex items-center gap-2 text-[#444] px-4 py-2 hover:bg-[#f2f4ef] rounded-lg font-label font-semibold text-sm hover:-translate-y-0.5 transition-all duration-200">
<span class="material-symbols-outlined">chevron_left</span>
                Back
            </button>
<button class="bg-gradient-to-r from-[#0d9488] to-[#0f766e] text-white rounded-lg px-8 py-3 flex items-center gap-2 shadow-md font-label font-semibold text-sm hover:shadow-xl hover:-translate-y-0.5 active:scale-95 transition-all duration-200">
                Next
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
</body></html>
