{% comment %}Branded OpenSurvey transactional email wrapper. Inline styles only (email
clients strip <style>/external CSS). Children fill {% block content %}; subject lives in the
sender (apps/accounts/emails.py), not here.{% endcomment %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light only" />
  <title>OpenSurvey</title>
</head>
<body style="margin:0; padding:0; background:#faf8f7; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#222b27;">
  <span style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">{% block preheader %}{% endblock %}</span>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#faf8f7; padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" style="max-width:520px; width:100%;">
          <tr>
            <td style="padding:6px 6px 18px;">
              <span style="font-size:22px; font-weight:700; letter-spacing:-0.01em; color:#222b27;">Open<span style="color:#0d9488;">Survey</span></span>
            </td>
          </tr>
          <tr>
            <td style="background:#ffffff; border:1px solid rgba(34,43,39,0.10); border-radius:14px; padding:32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 6px; color:#9aa09d; font-size:12px; line-height:18px;">
              {% block footer %}You're receiving this because this email address was used with OpenSurvey. If it wasn't you, you can safely ignore this message.{% endblock %}
              <br /><span style="color:#b9bdbb;">Powered by OpenSurvey</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
